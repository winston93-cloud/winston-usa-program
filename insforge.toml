[auth]
# Orígenes exactos (InsForge no acepta vacío como “cualquiera”).
# Conservar /login de qr-entrada y el origin de usa-program.
allowed_redirect_urls = [
  "http://127.0.0.1:3000/login",
  "http://127.0.0.1:4173/login",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/login",
  "http://127.0.0.1:5174",
  "http://127.0.0.1:5175",
  "http://localhost:3000/login",
  "http://localhost:4173/login",
  "http://localhost:5173",
  "http://localhost:5173/login",
  "http://localhost:5174",
  "http://localhost:5175",
  "https://winston-usa-program.vercel.app",
  "https://winston-usa-program.vercel.app/",
]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
